<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>COMEBACK · your phone</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22%3E%3Crect width=%2232%22 height=%2232%22 fill=%22%230b0b0b%22/%3E%3Ccircle cx=%2216%22 cy=%2216%22 r=%227%22 fill=%22%23ff3b30%22/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=IBM+Plex+Sans+Condensed:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/web/css/phone.css">
</head>
<body>
  <main class="ph">
    <header class="ph-top"><span class="ph-brand">COMEBACK</span><span class="ph-live" id="ph-live">NOT PAIRED</span></header>

    <section class="pair" id="pair">
      <p class="pair-k">YOUR PHONE · FAN DEVICE</p>
      <h1>Leave the match.<br>We'll call you back.</h1>
      <button class="big" id="pair-btn">TAP TO PAIR</button>
      <p class="hint" id="pair-hint">Keep this screen open: COMEBACK will ring and speak when it's time to come back.</p>
    </section>

    <section class="main" id="main" hidden>
      <div class="who" id="who"></div>
      <div class="score" id="score"></div>
      <div class="state" id="state"></div>
      <div class="btns"><button class="btn" id="away">I'M AWAY</button><button class="btn hot" id="back">I'M BACK</button></div>
      <div class="catchup" id="catchup" hidden></div>
      <div class="k">NOTIFICATIONS</div>
      <div class="notes" id="notes"></div>
    </section>
  </main>

  <div class="takeover" id="takeover" hidden>
    <div class="to-k" id="to-k">COME BACK</div>
    <div class="to-t" id="to-t"></div>
    <button class="big light" id="to-back">I'M BACK</button>
    <button class="to-x" id="to-x">dismiss</button>
  </div>

  <script type="module" src="/web/js/phone.js"></script>
</body>
</html>
