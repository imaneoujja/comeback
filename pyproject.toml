[project]
name = "comeback"
version = "0.1.0"
description = "The AI that watches the match for you while you're away."
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# report scripts print Markdown tables and SVG templates verbatim
"scripts/evaluate_alerts.py" = ["E501"]
"scripts/compare_single_agent.py" = ["E501"]
"scripts/evaluate_texts.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
